name: Carter's Care | Release Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: care-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck-lint-tests-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_AUTH_ENABLED: "false"
      DATABASE_URL: ""
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm
      - name: Reproducible install (lifecycle scripts disabled)
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Existing regression tests
        run: npm test
      - name: Dated roadmap validation
        run: node scripts/launch-control.mjs validate
      - name: Autopilot tests
        run: node --test scripts/launch-control.test.mjs
      - name: Demo-only build validation
        run: npm run build
